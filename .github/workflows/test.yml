name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Unit-Tests
        shell: bash
        run: |
          node --test --test-reporter=tap test/*.test.js | tee test-output.txt
          # Ohne passende Testdateien meldet node --test "0 Tests" und Erfolg.
          grep -Eq '^# pass [1-9]' test-output.txt
